name: Geoloods
description: >-
  A place-search and geocoding API that resolves named places (cities, towns, villages, parks, landmarks) to coordinates
  and rich location metadata over JSON/HTTPS. Covers 6.5M+ named places across 195 countries with coordinates, timezone,
  population, and country metadata. Agent-aware with machine signup and llms.txt index.
